[pytest]
testpaths = tests
addopts = -q
filterwarnings =
    error::DeprecationWarning:szp.*
markers =
    slow: takes more than a couple of seconds
    needs_model: needs the ONNX detector weights (scripts/fetch_model.py)
    needs_dataset: needs COCO val2017 on disk (scripts/fetch_data.py)
    needs_socketcan: needs a Linux vcan interface
