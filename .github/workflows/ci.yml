name: ci

# What CI can and cannot do here.
#
# It runs everything that needs neither a GPU nor a dataset: linting, the whole
# test suite, the pipeline end to end on the synthetic cell over a real Linux
# vcan interface, the calibration self-check, the FMEA consistency check and
# the check that every number quoted in the README comes from a file in
# results/published/.
#
# It does not run TensorRT, because GitHub's runners have no NVIDIA GPU and it
# does not run the COCO detection metrics on every push, because that is 1.1 GB
# of images.  The detector job below does export the real model and run it, so
# the ONNX path is exercised on every run of the workflow; the recall numbers
# themselves come from `make experiments` on a machine with the data and
# docs/tensorrt.md says plainly that no TensorRT figure has been measured.
#
# The vcan setup is the part worth noticing: the safety tests run against the
# real SocketCAN stack, not against an in-process stand-in.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bring up vcan0
        run: |
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
          ip -details -brief link show vcan0

      - name: Lint
        run: python -m flake8 src/ tests/ scripts/ analysis/

      - name: Tests
        run: python -m pytest tests/ -q --durations=15
        env:
          PYTHONPATH: src

      - name: The CAN tests really did run over socketcan
        run: |
          python -m pytest tests/test_can_link.py -q -k socketcan --durations=0 \
            | tee /tmp/can.txt
          grep -qE '[1-9][0-9]* passed' /tmp/can.txt || {
            echo "no socketcan-parametrised tests ran; vcan0 was not detected" >&2
            exit 1
          }
        env:
          PYTHONPATH: src

      - name: Pipeline end to end on the synthetic cell, over vcan
        run: |
          mkdir -p results
          python scripts/run_demo.py --can socketcan --channel vcan0 \
            --out results/ci_demo.json --timeline results/ci_demo.csv --quiet
        env:
          PYTHONPATH: src

      - name: The demo actually stopped for somebody
        run: |
          python - <<'PY'
          import json
          d = json.load(open("results/ci_demo.json"))
          states = d["states"]
          print(json.dumps(states))
          assert d["can_interface"] == "socketcan", d["can_interface"]
          assert d["internal_errors"] == 0, d["internal_errors"]
          # The scene starts empty, somebody walks in and the machine stops.
          for required in ("CLEAR", "WARN", "STOP"):
              assert states.get(required, 0) > 0, f"never reached {required}: {states}"
          plc = d["plc"]
          assert plc["frames_seen"] == d["frames_run"], plc
          assert plc["crc_failures"] == 0, plc
          assert plc["timeouts"] == 0, "the pipeline let the permit lapse while running"
          e2e = d["end_to_end_ms"]
          # A regression guard, not a benchmark.  The published numbers are in
          # results/published/ and come from a machine that is not a CI runner.
          assert e2e["p99"] < 250.0, e2e
          print("demo ok:", json.dumps({k: round(v, 3) for k, v in e2e.items()
                                        if isinstance(v, float)}))
          PY

      - name: The permit really does lapse when the pipeline stops talking
        run: |
          python - <<'PY'
          import sys, time
          sys.path.insert(0, "src")
          from szp.safety.plc_sim import SimulatedPlc
          from szp.safety.publisher import CanPublisher
          from szp.safety.can_frames import PERMIT_TIMEOUT_MS
          from szp.types import Cause, SafetyDecision, SafetyState

          clear = SafetyDecision(SafetyState.CLEAR, Cause.NONE, 0, float("inf"), False)
          with CanPublisher(channel="vcan0", interface="socketcan") as publisher:
              with SimulatedPlc(channel="vcan0", interface="socketcan") as plc:
                  deadline = time.perf_counter() + 5.0
                  while not plc.permitted and time.perf_counter() < deadline:
                      publisher.publish_estop(clear)
                      time.sleep(0.005)
                  assert plc.permitted, "a healthy stream never granted the permit"
                  quiet = time.perf_counter()
                  while plc.permitted and time.perf_counter() < quiet + 5.0:
                      time.sleep(0.005)
                  elapsed_ms = (time.perf_counter() - quiet) * 1000.0
                  assert not plc.permitted, "silence did not stop the machine"
                  print(f"permit lapsed {elapsed_ms:.0f} ms after the last frame "
                        f"(timeout {PERMIT_TIMEOUT_MS} ms)")
                  assert elapsed_ms < 4 * PERMIT_TIMEOUT_MS, elapsed_ms
          PY

      - name: Calibration self-check recovers a known transform
        run: |
          python scripts/calibrate.py --self-check --json results/ci_calibration.json
          python - <<'PY'
          import json
          d = json.load(open("results/ci_calibration.json"))
          check = d["self_check"]
          print(json.dumps(d, indent=2))
          assert check["translation_error_m"] < 0.05, check
          assert check["rotation_error_deg"] < 2.0, check
          assert d["camera_lidar"]["rms_m"] < d["camera_lidar"]["linear_rms_m"], (
              "the nonlinear refinement did not improve on the closed form"
          )
          PY
        env:
          PYTHONPATH: src

      - name: Geometry and zone decisions on the synthetic cell
        run: |
          python analysis/geometry_accuracy.py --duration 20 \
            --out results/ci_geometry.json --quiet
          python - <<'PY'
          import json
          d = json.load(open("results/ci_geometry.json"))
          for name, case in d["cases"].items():
              zone = case["zones"]["machine_envelope"]
              print(f"{name:<18} p50 err {case['position_error_m']['p50']:.3f} m  "
                    f"missed {zone['fn']}/{zone['frames_occupied']} occupied frames")
          both = d["cases"]["both_sensors"]
          assert both["position_error_m"]["p50"] < 0.15, both["position_error_m"]
          # The claim that matters: with no ranging sensors at all, a detected
          # person still trips the stop zone.
          none = d["cases"]["no_ranging"]
          assert none["fusion_counts"]["n_unranged"] > 0, none["fusion_counts"]
          assert none["zones"]["machine_envelope"]["fn"] == 0, none["zones"]
          PY
        env:
          PYTHONPATH: src

      - name: FMEA is self-consistent and cites tests that exist
        run: python analysis/make_fmea_summary.py --out results/ci_fmea.json --quiet

      - name: Every number in the README comes from a published result
        run: python scripts/check_docs.py --require-results

      - name: Zone configuration is loadable and inside the field of view
        run: python scripts/show_zones.py
        env:
          PYTHONPATH: src

      - name: Determinism -- the same seed gives the same states
        run: |
          python scripts/run_demo.py --frames 120 --seed 4242 --can virtual \
            --timeline /tmp/a.csv --out /tmp/a.json --quiet
          python scripts/run_demo.py --frames 120 --seed 4242 --can virtual \
            --timeline /tmp/b.csv --out /tmp/b.json --quiet
          python - <<'PY'
          import csv
          def states(path):
              with open(path) as handle:
                  return [row["state"] for row in csv.DictReader(handle)]
          a, b = states("/tmp/a.csv"), states("/tmp/b.csv")
          assert a == b, "the same seed produced different states"
          print(f"{len(a)} frames, identical state sequences")
          PY
        env:
          PYTHONPATH: src

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-results-py${{ matrix.python-version }}
          path: results/ci_*.json
          if-no-files-found: warn

  detector:
    # Exports the real YOLOv8n model and runs it.  Separate from `check`
    # because it installs the AGPL export toolchain and pulls torch, which is
    # slow and has no business in the runtime image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-export.txt

      - name: Cache the exported model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models
          key: yolov8n-onnx-v8.3.0-imgsz640-opset12

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export the model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          pip install -r requirements-export.txt
          python scripts/fetch_model.py

      - name: The detector runs and the two backends share their pre and post
        run: python -m pytest tests/test_detection.py tests/test_backends.py -q --durations=10
        env:
          PYTHONPATH: src

      - name: The real model through the whole pipeline
        run: |
          mkdir -p results
          python scripts/run_demo.py --detector onnx --frames 40 --can virtual \
            --out results/ci_demo_onnx.json --quiet
          python - <<'PY'
          import json
          d = json.load(open("results/ci_demo_onnx.json"))
          stages = d["stages_ms"]
          assert "inference" in stages, sorted(stages)
          assert stages["inference"]["p50"] > 0.0
          assert d["internal_errors"] == 0
          share = stages["inference"]["mean"] / d["end_to_end_ms"]["mean"]
          print(f"inference is {share:.0%} of the end-to-end mean on this runner")
          # docs/latency.md says the detector dominates.  If that stops being
          # true the documentation needs rewriting, so fail rather than drift.
          assert share > 0.5, share
          PY
        env:
          PYTHONPATH: src

      - name: Detection metrics smoke test on a handful of synthetic frames
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          import numpy as np
          from szp.detection.base import DetectorConfig, build_detector
          detector = build_detector(config=DetectorConfig(conf_threshold=0.15))
          detector.warmup(3)
          rng = np.random.default_rng(0)
          for _ in range(5):
              detector.detect(rng.integers(0, 255, (480, 640, 3), dtype=np.uint8))
          print(detector.info)
          assert detector.last_inference_ms > 0
          detector.close()
          PY

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the runtime image
        run: docker build -f docker/Dockerfile -t szp:ci .

      - name: The image has no AGPL export toolchain in it
        run: |
          if docker run --rm szp:ci python -c "import ultralytics" 2>/dev/null; then
            echo "ultralytics is in the runtime image; see docs/licences.md" >&2
            exit 1
          fi
          if docker run --rm szp:ci python -c "import torch" 2>/dev/null; then
            echo "torch is in the runtime image; the runtime is ONNX Runtime only" >&2
            exit 1
          fi
          echo "runtime image is free of the export toolchain"

      - name: The tests pass inside the image
        run: docker run --rm szp:ci python -m pytest tests/ -q

      - name: The demo runs inside the image
        run: |
          mkdir -p results
          docker run --rm -v "$PWD/results:/app/results" szp:ci \
            python scripts/run_demo.py --frames 60 --can virtual \
              --out /app/results/docker_demo.json --quiet
          python -c "import json; d=json.load(open('results/docker_demo.json')); \
            print(json.dumps(d['states'])); assert d['internal_errors']==0"
